# WebSocket upgrade for the SignalR hub (included at http level by conf.d).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    # Map uploads.
    client_max_body_size 20m;

    # SPA routes fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Host is forwarded so the API builds the OIDC redirect URI on :3000.
    location ~ ^/(api|signin-oidc|signout-callback-oidc)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Big chunked auth cookies and headers.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        # SignalR WebSocket: HTTP/1.1 upgrade, long idle read, no buffering of the stream.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
