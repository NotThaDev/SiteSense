services:
  api:
    build:
      context: .
      dockerfile: backend/SiteSense.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Store__RootPath: /var/lib/sitesense/store
      # Hangfire storage (Q08); abortConnect=false so a slow Redis start does not crash the API.
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      # Tenant ids must match tenant_id in docker/keycloak/sitesense-realm.json (Q14).
      Tenants__tenant-a__RetentionDays: 30
      Tenants__tenant-a__SilentAfterMinutes: 10
      Tenants__tenant-b__RetentionDays: 30
      Tenants__tenant-b__SilentAfterMinutes: 10
      # Same issuer as host tokens; keys from the internal name, since localhost is the container itself (Q02, Q74).
      Auth__Issuer: http://localhost:8081/realms/sitesense
      Auth__Audience: sitesense-api
      Auth__MetadataAddress: http://keycloak:8081/realms/sitesense/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      SITESENSE_TEST_MODE: ${SITESENSE_TEST_MODE:-false}
    volumes:
      - store-data:/var/lib/sitesense/store
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl; bash /dev/tcp is enough for an HTTP GET.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Admin UI; proxies API calls so the browser sees one origin (Q89).
  ui:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Plain HTTP on purpose (Q74): the backend reaches Keycloak the same way from a container
  # (http://keycloak:8081) or from the host with dotnet run (http://localhost:8081),
  # with no certificate to trust. Production puts TLS on an nginx reverse proxy in front.
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    # The sitesense realm (users, roles, clients) is versioned in docker/keycloak and imported
    # at start; an existing realm is kept, so recreate the container to load realm edits.
    command: start-dev --import-realm
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_HTTP_PORT: "8081"
      # Fixed issuer http://localhost:8081 for every caller (Q73). Backchannel URLs (jwks, token)
      # follow the request host, so a container can still use http://keycloak:8081.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    healthcheck:
      # Management port 9000 stays internal; the image has no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # One-shot: allow plain HTTP on the master realm (admin console). The realm import cannot do
  # it: the bootstrap admin creates master first, and the import skips existing realms. Keycloak's default
  # "external" rule asks for HTTPS when Docker forwards a host request from a non-private
  # address. No env var or flag sets a realm's sslRequired, so kcadm does it once (Q74).
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.5.0
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/keycloak/bin/kcadm.sh config credentials --config /tmp/kcadm.config
        --server http://keycloak:8081 --realm master
        --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"
        && /opt/keycloak/bin/kcadm.sh update realms/master --config /tmp/kcadm.config -s sslRequired=NONE

  redis:
    image: redis:8.4.0-alpine
    # Loopback only, for `dotnet run` on the host; containers use redis:6379.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional traffic generator (Q51): only with `docker compose --profile sim up simulator`.
  simulator:
    build:
      context: .
      dockerfile: simulator/SiteSense.Simulator/Dockerfile
    profiles: ["sim"]
    restart: "no"
    environment:
      SIM_API: http://api:8080
      # Internal token URL; the issuer stays http://localhost:8081 (KC_HOSTNAME), as the API expects (Q02).
      SIM_TOKEN_URL: http://keycloak:8081/realms/sitesense/protocol/openid-connect/token
      SIM_SITE: /data/site.json
      SIM_MAP: /data/map.geojson
    volumes:
      - ./data:/data:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  store-data:
  redis-data:
