services:
  api:
    build:
      context: .
      dockerfile: backend/SiteSense.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Store__RootPath: /var/lib/sitesense/store
      SITESENSE_TEST_MODE: ${SITESENSE_TEST_MODE:-false}
    volumes:
      - store-data:/var/lib/sitesense/store
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl; bash /dev/tcp is enough for an HTTP GET.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Plain HTTP on purpose (Q74): the backend reaches Keycloak the same way from a container
  # (http://keycloak:8081) or from the host with dotnet run (http://localhost:8081),
  # with no certificate to trust. Production puts TLS on an nginx reverse proxy in front.
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    command: start-dev
    ports:
      - "8081:8081"
    environment:
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    healthcheck:
      # Management port 9000 stays internal; the image has no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # One-shot: allow plain HTTP on the master realm (admin console). Keycloak's default
  # "external" rule asks for HTTPS when Docker forwards a host request from a non-private
  # address. No env var or flag sets a realm's sslRequired, so kcadm does it once (Q74).
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.5.0
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/keycloak/bin/kcadm.sh config credentials --config /tmp/kcadm.config
        --server http://keycloak:8081 --realm master
        --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"
        && /opt/keycloak/bin/kcadm.sh update realms/master --config /tmp/kcadm.config -s sslRequired=NONE

  redis:
    image: redis:8.4.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  store-data:
  redis-data:
